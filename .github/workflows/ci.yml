name: CI Practice
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check (bukan lint lengkap)
        run: python -m compileall -q app.py tests scripts
      - name: Unit dan integration tests
        run: python -m unittest discover -s tests -v
  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build container
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t cicd-practice:ci .
      - name: Start isolated container
        run: docker run -d --name cicd-smoke -p 127.0.0.1:8080:8080 cicd-practice:ci
      - name: Smoke test
        run: python scripts/smoke.py http://127.0.0.1:8080 --expect-version "$GITHUB_SHA"
      - name: Container log
        if: always()
        run: docker logs cicd-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f cicd-smoke || true
